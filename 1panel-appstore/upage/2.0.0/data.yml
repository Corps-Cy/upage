additionalProperties:
  formFields:
    - type: number
      labelZh: HTTP 端口
      labelEn: Port
      label:
        en: Port
        ja: ポート
        ko: 포트
        zh-hant: HTTP連接埠
        zh: HTTP 端口
      required: true
      rule: paramPort
      envKey: PANEL_APP_PORT_HTTP
      default: 3000
      edit: true

    - type: select
      labelZh: LLM 提供商
      labelEn: LLM provider
      label:
        en: LLM provider
        ja: LLMプロバイダー
        ko: LLM 공급자
        zh-hant: LLM 提供商
        zh: LLM 提供商
      required: true
      envKey: LLM_PROVIDER
      default: ZhiPuCodingPlan
      edit: true
      values:
        - label: 智谱 Coding Plan（推荐）
          value: ZhiPuCodingPlan
        - label: 智谱 AI
          value: ZhiPu
        - label: OpenAI
          value: OpenAI
        - label: DeepSeek
          value: Deepseek
        - label: 通义千问
          value: Qwen
        - label: 豆包
          value: DouBao
        - label: 月之暗面
          value: Kimi
        - label: Anthropic Claude
          value: Anthropic
        - label: Google
          value: Google
        - label: Ollama
          value: Ollama
        - label: OpenRouter
          value: OpenRouter
        - label: Groq
          value: Groq

    - type: password
      labelZh: API 密钥
      labelEn: API Key
      label:
        en: API Key
        ja: APIキー
        ko: API 키
        zh-hant: API 密鑰
        zh: API 密钥
      required: true
      envKey: PROVIDER_API_KEY
      default: ""
      edit: true

    - type: text
      labelZh: API 地址
      labelEn: API URL
      label:
        en: API URL
        ja: API URL
        ko: API URL
        zh-hant: API URL
        zh: API 地址
      description:
        en: "Note: Fill in only when using the OpenAI LLM provider."
        ja: "注：OpenAI LLMプロバイダーを使用する場合のみ記入してください。"
        ko: "참고: OpenAI LLM 공급자를 사용하는 경우에만 작성하십시오."
        zh-hant: "注意：僅在使用 OpenAI LLM 提供商時填寫。"
        zh: "注意：仅在使用 OpenAI/Ollama/LMStudio 提供商时填写。"
      required: false
      rule: paramHttp
      envKey: PROVIDER_BASE_URL
      default: ""
      edit: true

    - type: text
      labelZh: 页面默认模型
      labelEn: Default page model
      label:
        en: Default page model
        ja: デフォルトのページモデル
        ko: 기본 페이지 모델
        zh-hant: 页面默认模型
        zh: 页面默认模型
      required: true
      envKey: LLM_DEFAULT_MODEL
      default: "glm-5.1"
      edit: true

    - type: text
      labelZh: 辅助任务模型
      labelEn: Auxiliary task model
      label:
        en: Auxiliary task model
        ja: 補助タスクモデル
        ko: 보조 작업 모델
        zh-hant: 辅助任务模型
        zh: 辅助任务模型
      required: false
      envKey: LLM_MINOR_MODEL
      default: "glm-4.5-air"
      edit: true
